name: ci

# 일상 푸시와 PR 에서 돈다. release.yml 은 v* 태그에서만 도므로, 여기가 유일한 상시
# 게이트다. 매트릭스는 release.yml 에만 둔다 — CI 에서 4타깃을 돌릴 이유가 없다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # release.yml 과 같은 러너 이미지를 쓰고, 같은 방식으로 Rust 를 얻는다(러너에 선설치된
    # 툴체인, rustup 설치 스텝 없음). ubuntu-latest 는 시간이 지나면 다른 이미지로 흘러가
    # "CI 는 통과하는데 릴리즈가 깨진다" 를 만들므로 쓰지 않는다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # tests/cli.rs 의 show YAML 게이트는 파서가 없으면 건너뛴다. release.yml 과 똑같이
      # 파서를 깔고 KANG_REQUIRE_YAML 로 "건너뛰기" 자체를 실패로 만든다.
      - run: python3 -m pip install --break-system-packages --quiet pyyaml

      # 인덱스를 커밋하므로(Task 3 J2) 문서와 인덱스가 어긋난 커밋이 랜딩될 수 없어야 한다.
      # 어긋난 채로 오면 아래 cargo 스텝들도 rev 핀 불일치로 빨개지지만, 그 진단은
      # "인덱스를 다시 내라" 를 한 단계 멀리서 말한다. 그래서 이 게이트가 먼저 온다.
      - run: make index-check

      # KANG_REQUIRE_INDEX 는 인덱스 부재를 컴파일 에러로 올린다 (B3). 스텝마다 준다 —
      # job 전역으로 두면 위의 make index 부트스트랩이 스스로 막힌다.
      - run: cargo test
        env:
          KANG_REQUIRE_YAML: '1'
          KANG_REQUIRE_INDEX: '1'

      - run: cargo clippy --all-targets -- -D warnings
        env:
          KANG_REQUIRE_INDEX: '1'
      - run: cargo fmt --check

      # examples/ts-consumer 의 npm test 가 `kang types` 산출물을 tsc 에 실제로 태우는
      # 유일한 상시 게이트다. cargo test 는 생성된 TS 의 문자열만 보므로 그 파일이
      # 타입 체크되는지는 재지 못한다 (Task 7 우려 2).
      #
      # 러너 이미지의 node 를 쓰고 setup-node 스텝을 두지 않는다 — Rust 를 얻는 방식과
      # 같다. node 가 없으면 이 스텝이 그 사실을 말하며 실패한다.
      #
      # `kang` 은 소스에서 빌드해 넘긴다. 예시 자신은 빌드하지 않으므로(소비자에게 Rust
      # 툴체인이 없다는 것이 전제다) 여기서 만들어 $KANG 으로 준다. 릴리즈 아티팩트를
      # curl 로 받는 경로는 remote 와 릴리즈가 생긴 뒤에 검증할 수 있다.
      - run: cargo build
        env:
          KANG_REQUIRE_INDEX: '1'
      - run: npm ci
        working-directory: examples/ts-consumer
      - run: npm test
        working-directory: examples/ts-consumer
        env:
          KANG: ${{ github.workspace }}/target/debug/kang
