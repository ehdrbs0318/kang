name: ci

# 일상 푸시와 PR 에서 돈다. release.yml 은 v* 태그에서만 도므로, 여기가 유일한 상시
# 게이트다. 매트릭스는 release.yml 에만 둔다 — CI 에서 4타깃을 돌릴 이유가 없다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # release.yml 과 같은 러너 이미지를 쓰고, 같은 방식으로 Rust 를 얻는다(러너에 선설치된
    # 툴체인, rustup 설치 스텝 없음). ubuntu-latest 는 시간이 지나면 다른 이미지로 흘러가
    # "CI 는 통과하는데 릴리즈가 깨진다" 를 만들므로 쓰지 않는다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # tests/cli.rs 의 show YAML 게이트는 파서가 없으면 건너뛴다. release.yml 과 똑같이
      # 파서를 깔고 KANG_REQUIRE_YAML 로 "건너뛰기" 자체를 실패로 만든다.
      - run: python3 -m pip install --break-system-packages --quiet pyyaml

      - run: cargo test
        env:
          KANG_REQUIRE_YAML: '1'

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
